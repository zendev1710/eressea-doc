site_name: Eressea
site_url: https://zendev1710.github.io/eressea-doc/
repo_url: https://github.com/zendev1710/eressea-doc/
site_description: "Eressea documentation."
site_author: zendev1710

theme:
  font:
    # other fonts could be used (Merriweather, Lora, Playfair Display, PT Serif, Crimson Text...)
    text: Roboto
    code: Fira Code
  features:
    - header.autohide
    - content.code.copy
    # what is it ?
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    # not compatible with i18n
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - tables
    - toc.follow
    # - navigation.expand
    # - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  # font: false
  # https://materialdesignicons.com/
  # icon:
  #   logo: material/human-greeting
  #   logo_tech: material/bash
  #   logo_fpv: material/quadcopter
  # features:
  #   - navigation.tabs
  #   - navigation.expand
  #   - navigation.sections
  #   - toc.integrate
  # custom_dir: theme_overrides
# language: en

extra_css:
  - assets/css/extra.css
  - assets/css/lore-dialogue.css
  - assets/css/fantasy.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - javascripts/katex-init.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  # our own scripts
  - javascripts/formulas-try.js
  - javascripts/lore-dialogue.js

copyright: Copyright &copy; 2025 Cyril Guillon

