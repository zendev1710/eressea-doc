version: "3"

vars:
  # see:
  # - https://stackoverflow.com/a/61612842 for UTF8 characters with git diff
  # - https://unix.stackexchange.com/a/330662 for avoid exit code 1 with grep
  MODIFIED_FILES:
    sh: git -c core.quotepath=false --no-pager diff --no-renames --name-only --diff-filter=ACM origin/main | { grep -E "(.md$)" || true; }
  MODIFIED_FILES_INLINE:
    sh: echo "{{.MODIFIED_FILES}}" | tr '\n' ' '

tasks:
  install:
    desc: Install all necessaries dependencies (dev & mkdocs)
    cmds:
      - task: install:mkdocs
      - task: install:dev

  install:mkdocs:
    desc: Install mkdocs, theme and plugins
    cmds:
      - pip install --upgrade -r requirements.txt

  install:dev:
    desc: Install dev tools
    cmds:
      - |
        npm install -g \
          markdownlint-cli2 \
          markdown-link-check \
          cspell
      # Dictionaries imported by cspell.yml are resolved from ./node_modules
      - npm install

  deps:outdated:
    desc: List the pinned dependencies that have a newer version available
    cmds:
      - python scripts/update_requirements.py

  deps:update:
    desc: Bump requirements.txt to the latest non-breaking versions and install them
    cmds:
      - python scripts/update_requirements.py --write --stable
      - task: install:mkdocs

  deps:update:all:
    desc: Bump requirements.txt to every latest version, breaking changes included
    cmds:
      - python scripts/update_requirements.py --write
      - task: install:mkdocs

  run:
    desc: Serve documentation
    env:
      ENABLE_GIT_PLUGINS: false
    cmds:
      - properdocs serve

  build:
    desc: Build documentation
    env:
      ENABLE_PDF_PLUGIN: 1
    cmds:
      - properdocs build

  # into a git bash or WSL shell
  deploy:
    desc: Lint, publish the documentation on GitHub Pages and refresh the version shown in the header
    env:
      ENABLE_PDF_PLUGIN: 1
    cmds:
      # gh-deploy publishes the working tree, and the release tag needs the
      # commit to exist on GitHub: without this check the site would be updated
      # first and the version would then fail, leaving a half-done deploy.
      - |
        set -e
        DIRTY="$(git status --porcelain)"
        if [ -n "${DIRTY}" ]; then
          echo "working tree is not clean, commit or stash first:"
          echo "${DIRTY}"
          exit 1
        fi
        if ! git rev-parse --verify --quiet '@{u}' > /dev/null; then
          echo "no upstream configured for $(git rev-parse --abbrev-ref HEAD), cannot check the branch is pushed"
          exit 1
        fi
        UNSYNCED="$(git rev-list --count '@{u}...HEAD')"
        if [ "${UNSYNCED}" -gt 0 ]; then
          echo "${UNSYNCED} commit(s) differ from the upstream, push or pull first"
          exit 1
        fi
      # Gate on the deterministic linters only. lint:link queries external
      # websites, so an unavailable site would block a perfectly valid deploy.
      - task: lint:md
      - task: lint:spell
      - |
        set -e
        # git describe yields 0.9-24-g9fae305d: tag, commits since the tag,
        # commit id. Keep tag and count only, to display a clean 0.9.24.
        VERSION="$(git describe --tags --always || echo dev)"
        VERSION="$(printf '%s' "${VERSION}" | sed -E 's/-([0-9]+)-g[0-9a-f]+$/.\1/')"
        SHA="$(git rev-parse --short HEAD)"
        properdocs gh-deploy -m "Deployed ${SHA} - version ${VERSION}"
        # Material shows `tag_name` of releases/latest in the header (repository facts),
        # so a release must exist for the version to be displayed.
        PREV="$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.tag_name' 2>/dev/null || true)"
        if [ "${PREV}" = "${VERSION}" ]; then
          echo "Release ${VERSION} already published"
          exit 0
        fi
        # --generate-notes asks GitHub for the commit list since the previous
        # release; --notes is prepended to it, so the build stamp ends up above
        # the auto-generated "What's Changed" section.
        gh release create "${VERSION}" --target "$(git rev-parse HEAD)" --title "${VERSION}" \
          --generate-notes \
          --notes "Documentation build ${VERSION} (${SHA})"
        # Keep a single rolling release: drop the previous one created by this
        # task. A tag that exists locally is a real release (0.9, 1.0.0, ...)
        # and is never touched; ours only exist on GitHub.
        if [ -n "${PREV}" ] && ! git rev-parse --verify --quiet "refs/tags/${PREV}" > /dev/null; then
          gh release delete "${PREV}" --yes --cleanup-tag || true
        fi

  lint:
    desc: Lint documentation
    cmds:
      - task: lint:md
      - task: lint:spell
      - task: lint:link

  # into a git bash or WSL shell
  lint:md:
    desc: Lint all the markdown files with markdownlint
    cmds:
      - markdownlint-cli2 "docs/**/*.md"

  lint:link:
    desc: Lint all the markdown links with markdown-link-check
    cmds:
      - markdown-link-check --quiet -c .markdown-link-check.json docs

  lint:spell:
    desc: Spell check all the markdown files with cspell
    cmds:
      - cspell lint "docs/**/*.md" -c cspell.yml

  lint:spell-fr:
    desc: Spell check all the french markdown files with cspell
    cmds:
      - cspell lint "docs/**/*.fr.md" -c cspell.yml

  lint:spell-de:
    desc: Spell check all the german markdown files with cspell
    cmds:
      - cspell lint "docs/**/*.de.md" -c cspell.yml

  lint:spell-en:
    desc: Spell check all the english markdown files with cspell
    cmds:
      - cspell lint "docs/**/*.md" -c cspell.yml -e "docs/**/*.fr.md" -e "docs/**/*.de.md"

  lint:md-fr:
    desc: Lint the french markdown files with markdownlint
    cmds:
      - markdownlint-cli2 "docs/**/*.fr.md"

  lint:md-de:
    desc: Lint the german markdown files with markdownlint
    cmds:
      - markdownlint-cli2 "docs/**/*.de.md"

  lint:md-en:
    desc: Lint the english markdown files with markdownlint
    cmds:
      - markdownlint-cli2 "docs/**/*.md" "!docs/**/*.fr.md" "!docs/**/*.de.md"

  # into a git bash or WSL shell
  lint:link-fr:
    desc: Lint the french markdown links with markdown-link-check
    cmds:
      - find "docs/" -name "*.fr.md" -print0 | xargs -0 -n1 markdown-link-check --quiet -c .markdown-link-check.json

  # into a git bash or WSL shell
  lint:link-de:
    desc: Lint the german markdown links with markdown-link-check
    cmds:
      - find "docs/" -name "*.de.md" -print0 | xargs -0 -n1 markdown-link-check --quiet -c .markdown-link-check.json

  # into a git bash or WSL shell
  lint:link-en:
    desc: Lint the english markdown links with markdown-link-check
    cmds:
      - find "docs/" -name "*.md" ! -name "*.fr.md" ! -name "*.de.md" -print0 | xargs -0 -n1 markdown-link-check --quiet -c .markdown-link-check.json

  # into a git bash or WSL shell
  lint:md-on-changes:
    desc: Lint the modified markdown files with markdownlint (exit status code 2 if no modified files, 1 for an error, 0 otherwise)
    cmds:
      - "if [[ -n \"{{.MODIFIED_FILES}}\" ]]; then markdownlint-cli2 {{.MODIFIED_FILES_INLINE}}; else echo 'no modified markdown, lint ignored'; exit 2; fi"

  lint:spell-changes:
    desc: Spell check the modified markdown files with cspell (exit status code 2 if no modified files, 1 for an error, 0 otherwise)
    cmds:
      - "if [[ -n \"{{.MODIFIED_FILES}}\" ]]; then echo \"{{.MODIFIED_FILES}}\" | cspell lint -c cspell.yml --file-list stdin; else echo 'no modified markdown, lint ignored'; exit 2; fi"

  lint:link-changes:
    desc: Lint the modified markdown links with markdown-link-check (exit status code 2 if no modified files, 1 for an error, 0 otherwise)
    cmds:
      - "if [[ -n \"{{.MODIFIED_FILES}}\" ]]; then echo \"{{.MODIFIED_FILES}}\" | xargs -l1 markdown-link-check --quiet -c .markdown-link-check.json; else echo 'no modified markdown, lint ignored'; exit 2; fi"


  lint:link:all:
    desc: Lint all markdown links with markdown-link-check
    cmds:
      - "if [[ -n \"{{.MODIFIED_FILES}}\" ]]; then find \"docs/\" -name \"*.md\" -print0 | xargs -0 -n1 markdown-link-check --quiet -c .markdown-link-check.json; else echo 'no modified markdown, lint ignored'; exit 2; fi"

  lint:link:wget:
    desc: Lint all markdown links with wget (mkdocs server must running)
    cmds:
      - wget --recursive --spider --force-html --level=100 -nv -e robots=off -p -S http://127.0.0.1:8000

  lint:link:permalink:
    desc: Check that all pages contains a permalink definition
    cmds:
      - |
        set +e
        error=0
        for file in {{.MODIFIED_FILES_INLINE}}; do
          echo "Vérification du permalink dans le fichier : ${file}"
          grep -E '^permalink: \w+' $file > /dev/null
          if [ $? -ne 0 ]; then
            error=$((error+1))
            echo "Permalink missing in file $file"
          fi
        done
        if [ $error -gt 0 ]; then
          echo "One or more documentation files are missing a permalink"
          exit $error
        fi
