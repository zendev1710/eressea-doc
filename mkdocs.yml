site_name: Eressea
site_url: https://zendev1710.github.io/eressea-doc
repo_url: https://github.com/zendev1710/eressea-doc
site_description: "Eressea documentation."
site_author: zendev1710

theme:
  features:
    - content.tooltips
    - header.autohide
    - navigation.instant
    - navigation.indexes
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  # font: false
  # https://materialdesignicons.com/
  # icon:
  #   logo: material/human-greeting
  #   logo_tech: material/bash
  #   logo_fpv: material/quadcopter
  # features:
  #   - navigation.tabs
  #   - navigation.expand
  #   - navigation.sections
  #   - toc.integrate
  # custom_dir: theme_overrides
# language: en

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; 2025 Cyril Guillon

plugins:
  # - categories
  - alias
  # - awesome-nav
  - redirects
  - search
  # - autorefs
  # - live-edit
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: de
          name: Deutsch
          build: true
      docs_structure: suffix
      nav_translations:
        fr: # Translations for French
          home: accueil
          gameplay: le jeu
          exploration: Exploration
          production: production
          war: la guerre
          magic: magie
          alchemy: alchimie
          orders: ordres
          references: références
          help: aide
        de: # Translations for French
          home: Hauptseite
          gameplay: Spielablauf
          exploration: Erforschung
          production: produktion
          war: Krieg
          magic: magie
          alchemy: alchimie
          orders: Befehle
          references: Referenzen
          help: helfen
      # build_only_locale: !ENV [BUILD_ONLY_LOCALE]

# https://squidfunk.github.io/mkdocs-material/setup/changing-the-language/?h=language
extra:
  alternate:
    - name: English
      link: /eressea-doc/ 
      lang: en
    - name: Français
      link: /eressea-doc/fr/ 
      lang: fr
    - name: Deutsch
      link: /eressea-doc/de/
      lang: de

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences

