site_name: Eressea
site_url: https://zendev1710.github.io/eressea-doc
repo_url: https://github.com/zendev1710/eressea-doc
site_description: "Eressea documentation."
site_author: zendev1710

theme:
  font:
    # text: Roboto
    # TODO: try some fonts like : Merriweather, Lora, Playfair Display (PT Serif? Crimson Text?)
    text: Merriweather
    code: Roboto Mono
  features:
    - content.tooltips
    - header.autohide
    - navigation.indexes
    # not compatible with i18n
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  # font: false
  # https://materialdesignicons.com/
  # icon:
  #   logo: material/human-greeting
  #   logo_tech: material/bash
  #   logo_fpv: material/quadcopter
  # features:
  #   - navigation.tabs
  #   - navigation.expand
  #   - navigation.sections
  #   - toc.integrate
  # custom_dir: theme_overrides
# language: en

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; 2025 Cyril Guillon

plugins:
  # - categories
  - alias
  # - awesome-nav
  - redirects
  - search
  # - autorefs
  # - live-edit
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting-started: Premiers pas
            Gameplay: Jeu
            Exploration: Exploration
            References: Références
            Help: Aide
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Hauptseite
            Getting-started: Erste Schritte
            Gameplay: Spielablauf
            Exploration: Erforschung
            Production: Produktion
            War: Krieg
            Magic: Magie
            Alchemy: Alchimie
            Orders: Befehle
            References: Referenzen
            Help: helfen
      docs_structure: suffix
      # build_only_locale: !ENV [BUILD_ONLY_LOCALE]

# https://squidfunk.github.io/mkdocs-material/setup/changing-the-language/?h=language
extra:
  alternate:
    - name: English
      link: /eressea-doc/ 
      lang: en
    - name: Français
      link: /eressea-doc/fr/ 
      lang: fr
    - name: Deutsch
      link: /eressea-doc/de/
      lang: de

# Extensions
markdown_extensions:

# Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

