# https://squidfunk.github.io/mkdocs-material/setup/changing-the-language/?h=language
extra:
  alternate:
    - name: English
      link: /eressea-doc/
      lang: en
    - name: Français
      link: /eressea-doc/fr/
      lang: fr
    - name: Deutsch
      link: /eressea-doc/de/
      lang: de
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/JyAeYJw%7CDiscord

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  # Python Markdown Extensions
  # we use katex via js
  - pymdownx.arithmatex:
      # TODO: check if generic is needed
      generic: true
      #inline_syntax: true
  - pymdownx.betterem:
      smart_enable: all
  #- pymdownx.blocks
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

